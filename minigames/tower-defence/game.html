<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tower defence</title>
    <link rel="stylesheet" href="../chess/style.css?v=game-theme-v1">
    <link rel="stylesheet" href="./style.css?v=tower-combat-v4">
    <script src="./level.js?v=path-editor-v1" defer></script>
    <script src="./waves.js?v=enemy-waves-v1" defer></script>
    <script src="./combat.js?v=tower-combat-v4" defer></script>
    <script src="./script.js?v=tower-combat-v4" defer></script>
</head>
<body>
    <main class="chess-app">
        <header class="topbar">
            <div>
                <p class="eyebrow">TOWER DEFENCE</p>
                <h1>tower defence</h1>
            </div>
            <button type="button" id="clear-board" class="primary-button">Clear board</button>
        </header>
        <section class="game-layout tower-layout" aria-label="Tower placement">
            <div class="board-column">
                <div class="turn-card tower-toolbar">
                    <div id="tower-tools" class="tower-tools" role="group" aria-label="Choose a tower or remove tool"></div>
                </div>
                <div class="board-frame">
                    <div id="board" class="chess-board tower-board" aria-label="Tower placement grid"></div>
                    <div class="reticle-layer" aria-hidden="true"><span id="tower-reticle" hidden></span></div>
                    <div id="enemy-layer" class="enemy-layer" aria-hidden="true"></div>
                    <div id="projectile-layer" class="enemy-layer" aria-hidden="true"></div>
                </div>
                <div class="board-footer">
                    <span id="status" role="status">Loading towers...</span>
                    <span id="tower-count">0 towers</span>
                </div>
            </div>
            <aside class="game-sidebar">
                <section class="sidebar-card opening-card wave-panel" aria-labelledby="wave-heading">
                    <h2 id="wave-heading">Enemy waves</h2>
                    <p id="wave-status" role="status">Loading waves...</p>
                    <div class="editor-actions">
                        <button id="start-waves" type="button" class="primary-button" disabled>Start waves</button>
                        <button id="reset-waves" type="button" class="quiet-button" disabled>Reset waves</button>
                    </div>
                    <p class="opening-book-status">Select a placed tower to change its targeting.</p>
                </section>
                <section id="level-editor" class="sidebar-card opening-card level-editor" hidden>
                    <h2>Level editor</h2>
                    <p>Click or drag connected tiles. The first is the start and the last is the end. Select the previous tile to undo.</p>
                    <div class="editor-actions">
                        <button id="editor-undo" type="button" class="quiet-button">Undo</button>
                        <button id="editor-clear" type="button" class="quiet-button">Clear path</button>
                        <button id="editor-apply" type="button" class="primary-button">Apply &amp; export</button>
                        <button id="editor-cancel" type="button" class="quiet-button">Cancel</button>
                    </div>
                    <label for="level-code">Level string</label>
                    <textarea id="level-code" readonly rows="3" aria-label="Exported level string"></textarea>
                    <p id="editor-status" role="status"></p>
                </section>
                <section class="sidebar-card opening-card tower-details" aria-labelledby="tower-name">
                    <h2 id="tower-name">Loading towers...</h2>
                    <p id="tower-description" class="opening-name"></p>
                    <dl id="tower-attributes"></dl>
                    <p id="tower-note" class="opening-book-status"></p>
                    <div id="tower-targeting" hidden>
                        <label for="target-mode">Target priority</label>
                        <select id="target-mode">
                            <option value="first">First on path</option>
                            <option value="last">Last on path</option>
                            <option value="highest">Highest HP</option>
                            <option value="lowest">Lowest HP</option>
                            <option value="closest">Closest</option>
                            <option value="furthest">Furthest</option>
                        </select>
                        <button id="remove-placed-tower" type="button" class="quiet-button">Remove tower</button>
                        <button id="replace-placed-tower" type="button" class="quiet-button">Replace with selected tool</button>
                    </div>
                </section>
            </aside>
        </section>
    </main>
</body>
</html>
