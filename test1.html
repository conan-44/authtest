<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supabase Working Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @font-face { font-family: 'capsmall'; src: url('./assets/capsmall.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'lowbig'; src: url('./assets/lowbig.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'lowsmall'; src: url('./assets/lowsmall.otf') format('opentype'); font-weight: normal; font-style: normal; }
    body { background: #fff; color: #000; font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    input, button { display: block; width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; border: 4px solid #fff; }
    input { background: #ddd; color: #000; font-family: 'lowsmall'; }
    input::placeholder { font-family: 'lowsmall'; }
    button {
      display: flex;
      gap: 8px;
      background: #ccc;
      color: #000;
      border: none;
      cursor: pointer;
      font-size: 20px;
      transition: background-color 0.15s ease;
      font-family: 'capsmall';
    }
    button.button-pressed { background: #fff; }
    .notification-stack {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;
      display: grid;
      gap: 8px;
      width: min(320px, calc(100vw - 32px));
      pointer-events: none;
    }
    .notification {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.5);
      color: #000;
      font-family: 'capsmall', sans-serif;
      font-size: 16px;
      line-height: 1.2;
      animation: notification-in 0.2s ease-out;
    }
    .notification-label {
      flex: 0 0 8px;
      width: 8px;
      height: 8px;
      background-image: url('./assets/icons.png');
      background-repeat: no-repeat;
      background-position-y: -24px;
      transform: scale(4);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      animation: notification-label-play 0.5s steps(4) 1;
    }
    @keyframes notification-label-play {
      from { background-position-y: 0; }
      to { background-position-y: -32px; }
    }
    .notification-error { background: #ffb3b3; }
    .notification-success { background: #c6f7c6; }
    .notification-warning {color: #ffbf36; }
    .input-popup {
      display: grid;
      gap: 10px;
      pointer-events: auto;
    }
    .input-popup .notification-label { float: left; }
    .input-popup label {
      margin-left: 8px;
      font-size: 16px;
    }
    .input-popup input {
      width: 100%;
      margin: 0;
      border: 3px solid #000;
      background: #eee;
      font-family: 'lowsmall', sans-serif;
    }
    .input-popup-actions { display: flex; gap: 8px; }
    .input-popup-actions button {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      border: 2px solid #000;
      font-size: 14px;
    }
    @keyframes notification-in {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .btn-icon {
      display: inline-block;
      width: 8px;
      height: 8px;
      min-width: 8px;
      min-height: 8px;
      background-image: url('./assets/icons.png');
      background-repeat: no-repeat;
      background-position-y: -24px;
      transform: scale(4);
      transform-origin: center;
      margin: 8px 14px 4px 8px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .badge-gmail       { background-position-x: -00px; }
    .badge-mail          { background-position-x: -08px; }
    .badge-google  { background-position-x: -16px; }
     .icon-signup       { background-position-x: -24px; } 
    .icon-signin          { background-position-x: -32px; }  
    .icon-google        { background-position-x: -40px; }
    .icon-signout      { background-position-x: -48px; } 
    .icon-delete         { background-position-x: -56px; }  
    .icon-refresh    { background-position-x: -64px; } 
    .icon-save             { background-position-x: -72px; }
    .label-error        { background-position-x: -80px; }
    .label-warn           { background-position-x: -88px; }
    .label-success  { background-position-x: -96px; }
    .user-stuffs       { 
      font-family: 'capsmall';
      font-size: 18px;   
    }
    #displayUsername { font-family: 'lowsmall'; margin-top: 4px; }
    .user-header  { display: flex; align-items: center; }
    .user-header p { margin: 0 0 0 10px; }
    .box { background: #eee; padding: 16px; margin-bottom: 16px; }
    @keyframes playSprite { from { background-position-y: 0px; } to { background-position-y: -32px; } }
    button:hover .btn-icon { animation: playSprite 0.5s steps(4); }
    hr { border: 0; border-top: 1px solid #333; margin: 16px 0; }
    #authSectionHeader { font-family: 'lowbig', sans-serif; text-transform: lowercase; font-size: 32px; text-align: center; }
  </style>
</head>
<body>
  <!-- SIGNUP & LOGIN FORM -->
  <div id="authSection" class="box">
    <h3 id="authSectionHeader">Account Management</h3>
    <input type="email" id="email" placeholder="Email (e.g. test@game.com)" />
    <input type="password" id="password" placeholder="Password (min 6 chars)" />
    
    <!-- Custom Profile Inputs -->
    <input type="text" id="username" placeholder="Username (e.g. DragonSlayer)" />
    <input type="text" id="flair" placeholder="Flair (e.g. VIP Member)" />

    <button id="signUpBtn"><span class="btn-icon icon-signup"></span>Create Account</button>
    <button id="signInBtn" class="btn-secondary"><span class="btn-icon icon-signin"></span>Sign In with Email</button>
    <button id="googleSignInBtn" class="btn-secondary"><span class="btn-icon icon-google"></span>Sign In with Google</button>
  </div>

  <!-- LOGGED IN USER PROFILE SECTION -->
<div id="profileSection" class="box" style="display:none;">
  <div class="user-header">
    <span id="authBadge" class="btn-icon"></span>
    <p><span id="displayUsername" class="user-stuffs">Loading...</span></p>
  </div>
  <p><span id="displayFlair" class="user-stuffs">Loading...</span></p>

  <!-- ADD PASSWORD FORM (Only visible for Google-only users) -->
  <div id="addPasswordContainer" style="display:none;">
    <hr />
    <input type="password" id="newPasswordInput" placeholder="New Password (min 6 chars)" />
    <button id="addPasswordBtn">
      <span class="btn-icon icon-signup"></span>Add Password to Account
    </button>
  </div>
  
  <hr />    <!-- EDIT PROFILE FORM -->
    <input type="text" id="editUsername" placeholder="New Username" />
    <input type="text" id="editFlair" placeholder="New Flair" />
    <button id="updateProfileBtn"><span class="btn-icon icon-save"></span>Save Profile Changes</button>

    <button id="refreshBtn" class="btn-secondary"><span class="btn-icon icon-refresh"></span>Reload Profile Data</button>
    <button id="deleteAccountBtn" class="btn-danger"><span class="btn-icon icon-delete"></span>Delete Account</button>
    <button id="signOutBtn"><span class="btn-icon icon-signout"></span>Sign Out</button>
  </div>
  <script src="auth.js"></script>
</body>
</html>
